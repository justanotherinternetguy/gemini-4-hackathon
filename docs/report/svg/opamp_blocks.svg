<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 352" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <style>
    .w { stroke: #1b1b1a; stroke-width: 1.5; fill: none; }
    .rail { stroke: #1b1b1a; stroke-width: 2.4; }
    .t { font-size: 11px; font-weight: 700; fill: #1b1b1a; }
    .s { font-size: 9.4px; fill: #4a4945; }
    .r { font-size: 8.6px; font-weight: 700; letter-spacing: 0.06em; }
    .dash { stroke: #77766f; stroke-width: 1.1; stroke-dasharray: 4 3; fill: none; }
    .node { fill: #1b1b1a; }
  </style>
  <!-- rails -->
  <line class="rail" x1="30" y1="22" x2="680" y2="22"/>
  <text class="t" x="30" y="15">VDD = 1.8 V</text>
  <line class="rail" x1="30" y1="318" x2="680" y2="318"/>
  <text class="t" x="30" y="336">ground</text>

  <!-- stage 1 -->
  <rect x="70" y="40" width="210" height="54" rx="5" fill="#fde8de" stroke="#eb6834" stroke-width="1.5"/>
  <text class="r" x="80" y="55" fill="#c2491a">LOAD · PMOS MIRROR</text>
  <text class="s" x="80" y="70">copies current left → right; high</text>
  <text class="s" x="80" y="83">resistance at the stage-1 output</text>

  <rect x="70" y="122" width="210" height="54" rx="5" fill="#e1ecfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text class="r" x="80" y="137" fill="#1f5fae">IN · NMOS DIFFERENTIAL PAIR</text>
  <text class="s" x="80" y="152">turns vp − vm into a current</text>
  <text class="s" x="80" y="165">(transconductance gm_in)</text>

  <rect x="70" y="204" width="210" height="54" rx="5" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="r" x="80" y="219" fill="#12805a">TAIL · NMOS CASCODE SOURCE</text>
  <text class="s" x="80" y="234">fixed current for the pair;</text>
  <text class="s" x="80" y="247">needs a little voltage headroom</text>

  <line class="w" x1="175" y1="22" x2="175" y2="40"/>
  <line class="w" x1="175" y1="94" x2="175" y2="122"/>
  <line class="w" x1="175" y1="176" x2="175" y2="204"/>
  <line class="w" x1="175" y1="258" x2="175" y2="318"/>
  <!-- inputs -->
  <line class="w" x1="36" y1="140" x2="70" y2="140"/>
  <line class="w" x1="36" y1="160" x2="70" y2="160"/>
  <text class="t" x="8" y="144">vp</text>
  <text class="t" x="8" y="164">vm</text>

  <!-- node X -->
  <line class="w" x1="175" y1="108" x2="420" y2="108"/>
  <circle class="node" cx="175" cy="108" r="3.5"/>
  <circle class="node" cx="330" cy="108" r="3.5"/>
  <text class="t" x="292" y="101">node X</text>
  <text class="s" x="286" y="123">stage-1 output</text>

  <!-- stage 2 -->
  <rect x="420" y="40" width="200" height="72" rx="5" fill="#e7e4fa" stroke="#6250d6" stroke-width="1.5"/>
  <text class="r" x="430" y="55" fill="#4a3bb5">DRV · PMOS COMMON SOURCE</text>
  <text class="s" x="430" y="70">gate at node X; second gain</text>
  <text class="s" x="430" y="83">stage; sets how fast vout</text>
  <text class="s" x="430" y="96">can drive the load (gm_drv)</text>

  <rect x="420" y="214" width="200" height="54" rx="5" fill="#fbe6ee" stroke="#e87ba4" stroke-width="1.5"/>
  <text class="r" x="430" y="229" fill="#b8406d">SINK · NMOS CASCODE SOURCE</text>
  <text class="s" x="430" y="244">fixed current for stage 2;</text>
  <text class="s" x="430" y="257">the largest share of i_core</text>

  <line class="w" x1="520" y1="22" x2="520" y2="40"/>
  <line class="w" x1="520" y1="112" x2="520" y2="214"/>
  <line class="w" x1="520" y1="268" x2="520" y2="318"/>
  <circle class="node" cx="520" cy="178" r="3.5"/>
  <line class="w" x1="520" y1="178" x2="690" y2="178"/>
  <text class="t" x="660" y="171">vout</text>
  <!-- CL -->
  <line class="w" x1="640" y1="178" x2="640" y2="248"/>
  <line class="w" x1="626" y1="248" x2="654" y2="248"/>
  <line class="w" x1="626" y1="256" x2="654" y2="256"/>
  <line class="w" x1="640" y1="256" x2="640" y2="318"/>
  <text class="t" x="649" y="243">CL</text>
  <text class="s" x="649" y="276">500 fF</text>

  <!-- compensation -->
  <path class="w" d="M330,108 V178 H352"/>
  <path class="w" d="M352,178 l5,-7 l7,14 l7,-14 l7,14 l7,-14 l5,7"/>
  <line class="w" x1="390" y1="178" x2="420" y2="178"/>
  <line class="w" x1="420" y1="166" x2="420" y2="190"/>
  <line class="w" x1="428" y1="166" x2="428" y2="190"/>
  <line class="w" x1="428" y1="178" x2="520" y2="178"/>
  <text class="t" x="358" y="164">Rz</text>
  <text class="t" x="432" y="162">Cc</text>
  <text class="s" x="338" y="203">Miller compensation:</text>
  <text class="s" x="338" y="215">Cc sets the bandwidth,</text>
  <text class="s" x="338" y="227">Rz tames the zero</text>

  <!-- bias network -->
  <rect x="210" y="276" width="170" height="34" rx="4" fill="#f4f3ee" stroke="#77766f" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text class="t" x="220" y="291">frozen bias network</text>
  <text class="s" x="220" y="303">Ibias → cascode gate voltages</text>
  <path class="dash" d="M240,276 V259"/>
  <path class="dash" d="M380,293 H470 V269"/>
</svg>
